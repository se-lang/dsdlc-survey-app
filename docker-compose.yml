name: "lebenslaeufe-app"
services:
    redis:
        image: redis:7
        volumes:
            - redis_data:/data
        ports:
            - "16379:6379"
    postgres:
        image: postgres:16
        environment:
            POSTGRES_PASSWORD: django
            POSTGRES_USER: django
            POSTGRES_DB: django
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "15432:5432"
    mailpit:
        image: axllent/mailpit
        ports:
            - "1025:1025"
            - "8025:8025"
volumes:
    postgres_data: {}
    redis_data: {}
