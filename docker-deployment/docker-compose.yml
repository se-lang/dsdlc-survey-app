name: "lebenslaeufe-app"
services:
    redis:
        image: redis:7
        volumes:
            - "./.docker-data/redis:/data"
    postgres:
        image: postgres:16
        environment:
            POSTGRES_PASSWORD: django
            POSTGRES_USER: django
            POSTGRES_DB: django
        volumes:
            - "./.docker-data/pg:/var/lib/postgresql/data"
    django:
        image: dezignweiland/dzhw-test:0.0.4-django
        environment:
            LLA_CONFIG_FILE: "/home/app/lla.config.toml"
        volumes:
            - "./lla.config.docker.toml:/home/app/lla.config.toml:ro"
            - "./.docker-data/media:/home/app/.media"
        command: ["migrate_then_start"]
    celery_beat:
        image: dezignweiland/dzhw-test:0.0.4-django
        environment:
            LLA_CONFIG_FILE: "/home/app/lla.config.toml"
        volumes:
            - "./lla.config.docker.toml:/home/app/lla.config.toml:ro"
        command: ["start_celery_beat"]
    celery_worker:
        image: dezignweiland/dzhw-test:0.0.4-django
        environment:
            LLA_CONFIG_FILE: "/home/app/lla.config.toml"
        volumes:
            - "./lla.config.docker.toml:/home/app/lla.config.toml:ro"
            - "./.docker-data/media:/home/app/.media"
        command: ["start_celery"]
    nginx:
        image: dezignweiland/dzhw-test:0.0.4-nginx
        ports:
            - "8080:80"
    caddy:
        image: caddy
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - "./conf:/etc/caddy:ro"
            - "./.docker-data/media:/srv/api/media:ro"
            - "caddy_data:/data"
            - "caddy_config:/config"
volumes:
    caddy_data:
    caddy_config:
