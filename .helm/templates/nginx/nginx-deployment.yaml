kind: Deployment
apiVersion: apps/v1
metadata:
    name: {{ include "dsdlc.v1.nginx.fullname" . }}
    labels:
        app.kubernetes.io/component: reverseProxy
spec:
    selector:
        matchLabels:
            app.kubernetes.io/component: reverseProxy
    revisionHistoryLimit: 1
{{ if eq .Values.infra.nginx.minReplicas .Values.infra.nginx.maxReplicas }}
    replicas: {{ .Values.infra.nginx.minReplicas }}
{{ end }}
    template:
        metadata:
            labels:
                app.kubernetes.io/component: reverseProxy
        spec:
            imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 16 }}
            tolerations: {{ toYaml .Values.tolerations | nindent 16 }}
            nodeSelector: {{ toYaml .Values.nodeSelector | nindent 16 }}
            topologySpreadConstraints:
                -   maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
                    labelSelector:
                        matchLabels:
                            app.kubernetes.io/component: reverseProxy
            containers:
                -   name: nginx
                    image: {{.Values.werf.image.nginx }}
                    ports:
                        -   containerPort: 80
                            name: http
                    resources:
                        requests:
                            cpu: "{{.Values.infra.nginx.cpuRequests}}"
                            memory: "10Mi"
