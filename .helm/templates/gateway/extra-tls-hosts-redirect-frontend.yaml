{{ if and .Values.gatewayApi.enabled .Values.gatewayApi.tls.enabled }}
{{ range $index, $host := .Values.gatewayApi.extraFrontendTlsHostnames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: extra-tls-hosts-redirect-frontend-{{$index}}
spec:
    parentRefs: {{ include "dsdlc.v1.gatewayHttpRef" (dict "root" $ "host" $host) | nindent 8 }}
    rules:
        -   filters:
                -   type: RequestRedirect
                    requestRedirect:
                        scheme: https
                        hostname: {{ index $.Values.gatewayApi.frontendHostnames 0 }}
---
{{ end }}
{{ range $index, $host := .Values.gatewayApi.extraFrontendTlsHostnames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: extra-tls-hosts-redirect-frontend-https-{{$index}}
spec:
    parentRefs: {{ include "dsdlc.v1.gatewayHttpsRef" (dict "root" $ "host" $host) | nindent 8 }}
    rules:
        -   filters:
                -   type: RequestRedirect
                    requestRedirect:
                        scheme: https
                        hostname: {{ index $.Values.gatewayApi.frontendHostnames 0 }}
---
{{ end }}
{{ end }}
