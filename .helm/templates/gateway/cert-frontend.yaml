{{ if and .Values.gatewayApi.enabled .Values.gatewayApi.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: {{ include "dsdlc.v1.tlsSecretGatewayFrontend.fullname" . }}
spec:
    issuerRef: {{ .Values.gatewayApi.tls.issuerRef | toYaml | nindent 8 }}
    secretName: {{ include "dsdlc.v1.tlsSecretGatewayFrontend.fullname" . }}
    dnsNames: {{ (concat .Values.gatewayApi.frontendHostnames .Values.gatewayApi.extraFrontendTlsHostnames) | toYaml | nindent 8 }}
{{ end }}
