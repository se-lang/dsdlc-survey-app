{{ if and .Values.gatewayApi.enabled .Values.gatewayApi.tls.enabled }}
{{ range $index, $host := (concat .Values.gatewayApi.apiHostnames .Values.gatewayApi.frontendHostnames) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: http-to-https-redirect-{{$index}}
spec:
    parentRefs: {{ include "dsdlc.v1.gatewayHttpRef" (dict "root" $ "host" $host) | nindent 8 }}
    rules:
        -   filters:
                -   type: RequestRedirect
                    requestRedirect:
                        scheme: https
---
{{ end }}
{{ end }}
