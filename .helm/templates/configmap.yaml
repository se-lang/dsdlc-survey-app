apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "dsdlc.v1.configMap.fullname" . }}
data:
{{- $chartConfig := (tpl ($.Files.Get "lla.config.yaml") $) | fromYaml -}}
{{- $chartConfig = mustMergeOverwrite .Values.applicationConfig $chartConfig }}
    lla.config.yaml: {{ $chartConfig | toYaml | quote }}
