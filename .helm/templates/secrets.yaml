apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsdlc.v1.secret.fullname" . }}
type: Opaque
stringData:
  secret_key: '{{ .Values.api.secretKey }}'
  db_password: "{{ .Values.databaseConnection.password | default .Values.postgresql.auth.password }}"
  email_password: "{{ .Values.email.password }}"
{{ if hasKey .Values.storage "secret_key" }}
  storage_secret_key: "{{ .Values.storage.secret_key }}"
{{ end -}}
{{ if .Values.redisConnection.password }}
  redis_password: "{{ .Values.redisConnection.password }}"
{{- end -}}
