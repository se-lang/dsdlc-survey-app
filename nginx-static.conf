server {
    listen       80;
    server_name  localhost;

    gzip_static  on;
    zstd_static on;
    brotli_static on;

    location /static {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

