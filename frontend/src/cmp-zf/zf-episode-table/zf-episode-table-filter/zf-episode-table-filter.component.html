<div class="buttons">
    @for (category of categories(); track category.category.id) {
        <button
            type="button"
            class="lla-rounded-button lla-button--inverted"
            [llaZfEpisodeColorStyles]="category.category"
            [attr.aria-pressed]="category.selected ? 'true' : 'false'"
            (click)="tableService.toggleCategoryFilter(category.category.id)"
        >
            <lla-icon [name]="`episode-categories/${category.category.id}`" />
            {{ category.category.label }}
        </button>
    }
</div>
