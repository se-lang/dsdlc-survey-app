<ng-container *transloco="let t; prefix: 'forgotPassword'">
    <lla-dialog-header [color]="'brand'" [title]="t('header')">
        <a
            [routerLink]="'/login'"
            [queryParamsHandling]="'merge'"
            class="lla-icon-button"
            slot="icon-button-left"
            [attr.aria-label]="t('backToLogin')"
        >
            <lla-icon [name]="'arrow-left-circle'" />
        </a>
    </lla-dialog-header>
    <lla-dialog-content>
        @if (success()) {
            <div>
                <p>{{ t("success.1") }}</p>
                <p>{{ t("success.2") }}</p>
                <p>{{ t("success.3") }}</p>
                <p>
                    <a routerLink="/login">{{ t("backToLogin") }}</a>
                </p>
            </div>
        } @else {
            <form [formGroup]="formGroup" (ngSubmit)="submit()" #formElement>
                <div class="lla-form-row">
                    <label class="lla-large-label" [for]="emailInputId">{{
                        t("labelEmail")
                    }}</label>
                    <input
                        class="lla-form-control"
                        [id]="emailInputId"
                        type="text"
                        inputmode="email"
                        [formControl]="formGroup.controls.email"
                    />
                    <val-errors [control]="formGroup.controls.email">
                        <ng-template valFallback>{{ t("error.email") }}</ng-template>
                    </val-errors>
                </div>
                <div class="lla-button-grid">
                    <button class="lla-flat-button" type="submit" [disabled]="submitting()">
                        @if (submitting()) {
                            Loading...
                        } @else {
                            {{ t("submitButton") }}
                        }
                    </button>
                </div>
                <val-errors [control]="formGroup">
                    <ng-template valFallback>
                        {{ t("error.generic") }}
                    </ng-template>
                </val-errors>
            </form>
        }
    </lla-dialog-content>
</ng-container>
