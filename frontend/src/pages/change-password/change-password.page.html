<ng-container *transloco="let t; prefix: 'changePassword'">
    @if (success()) {
        <div>
            <p>{{ t("success.1") }}</p>
            <p>
                <a [routerLink]="'/'">{{ t("backToDashboard") }}</a>
            </p>
        </div>
    } @else {
        <form [formGroup]="formGroup" (ngSubmit)="submit()" #formElement>
            <div class="lla-form-row">
                <label class="lla-large-label" [for]="componentId + 'password'">{{
                    t("password")
                }}</label>
                <input
                    class="lla-form-control"
                    [id]="componentId + 'password'"
                    type="password"
                    [formControl]="formGroup.controls.password"
                />
                <val-errors [control]="formGroup.controls.password">
                    <ng-template [valError]="'required'">
                        {{ t("error.password") }}
                    </ng-template>
                    <ng-template valFallback let-error="error">{{ error }}</ng-template>
                </val-errors>
            </div>
            <div class="lla-form-row">
                <label class="lla-large-label" [for]="componentId + 'passwordRepeat'">
                    {{ t("passwordRepeat") }}
                </label>
                <input
                    class="lla-form-control"
                    [id]="componentId + 'passwordRepeat'"
                    type="password"
                    [formControl]="formGroup.controls.password2"
                />
                <val-errors [control]="formGroup.controls.password2">
                    <ng-template valFallback>{{ t("error.password2") }}</ng-template>
                </val-errors>
                <val-errors [control]="formGroup">
                    <ng-template valError="password_mismatch">
                        {{ t("error.passwordMismatch") }}
                    </ng-template>
                    <ng-template valError="server.generic"></ng-template>
                    <ng-template valFallback></ng-template>
                </val-errors>
            </div>
            <div class="lla-button-grid">
                <button class="lla-flat-button" type="submit" [disabled]="submitting()">
                    @if (submitting()) {
                        Loading...
                    } @else {
                        {{ t("submitButton") }}
                    }
                </button>
            </div>
            <val-errors [control]="formGroup">
                <ng-template valError="password_mismatch"></ng-template>
                <ng-template valFallback>
                    {{ t("error.generic") }}
                </ng-template>
            </val-errors>
        </form>
    }
</ng-container>
