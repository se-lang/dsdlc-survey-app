<ng-container *transloco="let t; prefix: 'resetPassword'">
    <lla-dialog-header [color]="'brand'" [title]="t('header')" />
    <lla-dialog-content>
        @if (success()) {
            <p>{{ t("success") }}</p>
            <p>
                <a routerLink="/login">{{ t("backToLogin") }}</a>
            </p>
        } @else {
            <form (ngSubmit)="submit()" [formGroup]="formGroup" #formElement>
                <div class="lla-form-row">
                    <label [for]="id1">{{ t("label.password") }}</label>
                    <input
                        class="lla-form-control"
                        type="password"
                        [id]="id1"
                        [formControl]="formGroup.controls.newPassword"
                    />
                    <val-errors [control]="formGroup.controls.newPassword">
                        <ng-template valFallback>{{ t("error.password") }}</ng-template>
                    </val-errors>
                </div>
                <div class="lla-form-row">
                    <label [for]="id2">{{ t("label.password2") }}</label>
                    <input
                        class="lla-form-control"
                        type="password"
                        [id]="id2"
                        [formControl]="formGroup.controls.password2"
                    />
                    <val-errors [control]="formGroup.controls.password2">
                        <ng-template valFallback>{{ t("error.password2") }}</ng-template>
                    </val-errors>
                    <val-errors [control]="formGroup">
                        <ng-template valError="password_mismatch">
                            {{ t("error.mismatch") }}
                        </ng-template>
                    </val-errors>
                </div>
                <div>
                    <button class="lla-flat-button" type="submit" [disabled]="submitting()">
                        @if (submitting()) {
                            {{ t("submitButtonLoading") }}
                        } @else {
                            {{ t("submitButton") }}
                        }
                    </button>
                </div>
                <val-errors [control]="formGroup">
                    <ng-template valError="password_mismatch"></ng-template>
                    <ng-template valFallback>
                        {{ t("error.generic") }}
                    </ng-template>
                </val-errors>
            </form>
        }
    </lla-dialog-content>
</ng-container>
